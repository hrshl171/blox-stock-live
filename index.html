<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Fruits Live Stock</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:10px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#00ff99;
    margin:8px 0 15px;
    font-size:24px;
}

.container{
    display:flex;
    gap:8px;
    width:100%;
}

.stock{
    flex:1;
    height:75vh;
    border:2px solid #333;
    border-radius:12px;
    overflow:hidden;
    background:#222;
}

.stock iframe{
    width:100%;
    height:100%;
    border:0;
}

@media(max-width:500px){
    .stock{
        height:70vh;
    }
}
</style>
</head>

<body>

<h1>🍎 BLOX FRUITS STOCK</h1>

<div class="container">

    <div class="stock">
        <iframe
            src="https://www.gamersberg.com/blox-fruits/stock?tab=normal">
        </iframe>
    </div>

    <div class="stock">
        <iframe
            src="https://www.gamersberg.com/blox-fruits/stock?tab=mirage">
        </iframe>
    </div>

</div>

</body>
</html>
